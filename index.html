<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E6A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Para Onde Vai">
<title>Para Onde Vai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: coluna única pensada para telemóvel, cabeçalho com mês, barra de navegação em baixo com botão + ao centro. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --fg:#13201D; --muted:#5B6B66; --line:#DCE3E0;
  --accent:#0B6E6A; --accent-fg:#FFFFFF; --accent-soft:#D8EEEC;
  --warn:#B93C0A; --warn-soft:#FDE7DA;
  --c0:#0B6E6A; --c1:#C2410C; --c2:#5B4BDB; --c3:#B8860B; --c4:#2B7A3D; --c5:#B03060; --c6:#2F6FB5; --c7:#7A6A5A;
  --font-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#17211E; --fg:#E7F0ED; --muted:#93A7A1; --line:#27352F;
    --accent:#4CC3BC; --accent-fg:#06201E; --accent-soft:#16413E;
    --warn:#FF9A6B; --warn-soft:#3A2218;
    --c0:#4CC3BC; --c1:#FF9A6B; --c2:#A79BFF; --c3:#E8C766; --c4:#7ED18E; --c5:#F08DB3; --c6:#7DB4F0; --c7:#C7B8A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211E; --fg:#E7F0ED; --muted:#93A7A1; --line:#27352F;
  --accent:#4CC3BC; --accent-fg:#06201E; --accent-soft:#16413E;
  --warn:#FF9A6B; --warn-soft:#3A2218;
  --c0:#4CC3BC; --c1:#FF9A6B; --c2:#A79BFF; --c3:#E8C766; --c4:#7ED18E; --c5:#F08DB3; --c6:#7DB4F0; --c7:#C7B8A8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-family:var(--font-display);font-size:15px;font-weight:700;margin:0;color:var(--muted);letter-spacing:.02em}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .m{font-family:var(--font-display);font-weight:700;font-size:17px;min-width:150px;text-align:center;text-transform:capitalize}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* resumo */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;margin:6px 0 18px}
.hero .lbl{font-size:13px;color:var(--muted);margin:0 0 2px;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;line-height:1.1;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere;color:var(--fg)}
.hero .sub{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--bg);margin:18px 0 12px;gap:2px}
.stack span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{display:inline-block}
.legend b{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.note{display:block;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;color:var(--fg);font:inherit;resize:vertical}
h2{font-family:var(--font-display);font-size:14px;font-weight:700;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.bar-row{padding:11px 0;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
.bar-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.bar-head .n{min-width:0;overflow-wrap:anywhere;font-weight:500}
.bar-head .v{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.bar-head .p{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px;font-family:var(--font-body)}
.track{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}

/* listas */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.day .num{font-weight:700}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 16px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.row .t{flex:1;min-width:0}
.row .d{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .a{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.row.plan .d,.row.plan .a{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--font-display);font-size:18px;margin-bottom:6px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:6px 0 12px}
.info{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:6px 0 4px}
.summary .num{font-size:22px;font-weight:700}

/* definições */
.edit{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.edit:last-child{border-bottom:0}
.edit input{flex:1;min-width:0}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0}

/* campos */
input[type=text],input[type=date],input[type=time],input[type=search],select{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;color:var(--fg)}
input[inputmode=decimal]{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;color:var(--fg);font-family:var(--font-display);font-size:20px;font-weight:700}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 5px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.55;cursor:default}
.rm{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--warn);font-size:18px;line-height:1}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;gap:4px}
.tab{background:transparent;border:0;border-radius:12px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);min-height:48px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.fab[hidden]{display:none}

/* folha de formulário */
.back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.back{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-family:var(--font-display);font-size:20px;margin:0 0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin:10px 0 0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.err{color:var(--warn);font-size:13.5px;min-height:1.2em;margin:10px 0 0}
.actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.actions .grow{flex:1}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.check input{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}

.status{border-radius:12px;padding:9px 14px;font-size:13.5px;margin:4px 0 10px}
.status.off{background:var(--warn-soft);color:var(--warn)}
.status.sync{background:var(--accent-soft);color:var(--accent)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:grid;gap:6px;min-height:96px;align-content:start}
.mi svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mi b{font-family:var(--font-display);font-size:16px}
.mi span{font-size:12.5px;color:var(--muted)}
.backl{background:transparent;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:14px}
.pagehead h2{font-size:22px;text-transform:none;color:var(--fg);margin:2px 0 8px;letter-spacing:-.01em}
.weeknav{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.weeknav .m{font-family:var(--font-display);font-weight:700;text-align:center;flex:1}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;font-weight:700;font-family:var(--font-display);font-size:15px}
.dayh>span:first-child{display:inline-block}
.dayh>span:first-child::first-letter{text-transform:uppercase}
.dayh.today{color:var(--accent)}
.row .tm{flex:none;width:52px;font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.25}
.nod{color:var(--muted);font-size:13px;padding:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.shop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 16px}
.shop:last-child{border-bottom:0}
.shop .ck{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700}
.shop.done .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.shop.done .tx{text-decoration:line-through;color:var(--muted)}
.prog{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 4px}
input.bud{width:86px;flex:none;min-height:40px;font-size:13px;text-align:right;font-family:var(--font-body);font-weight:500}
.srch{margin:0 0 10px}
.code{font-family:var(--font-display);letter-spacing:.04em}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PARA ONDE VAI</h1>
    <div class="monthnav" id="monthnav">
      <button class="iconbtn" id="prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="m" id="mlabel" aria-live="polite"></div>
      <button class="iconbtn" id="next" aria-label="Mês seguinte"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Secções da aplicação">
  <div class="nav-in">
    <button class="tab" data-tab="resumo"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
    <button class="tab" data-tab="despesas"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Despesas</button>
    <button class="fab" id="fab" aria-label="Adicionar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="tab" data-tab="mais"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></svg>Mais</button>
  </div>
</nav>

<div class="back" id="back" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const eur0=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const money=c=>eur.format(c/100);
const pad=n=>String(n).padStart(2,"0");
const nf=(x,d)=>Number(x).toLocaleString("pt-PT",{minimumFractionDigits:d,maximumFractionDigits:d});
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const parts=iso=>{const a=iso.split("-").map(Number);return {y:a[0],m:a[1],d:a[2]}};
const dim=(y,m)=>new Date(y,m,0).getDate();
const dayNum=iso=>{const p=parts(iso);return Math.floor(Date.UTC(p.y,p.m-1,p.d)/864e5)};
const addDays=(iso,n)=>{const p=parts(iso);const d=new Date(Date.UTC(p.y,p.m-1,p.d+n));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())};
const dow=iso=>{const p=parts(iso);return (new Date(p.y,p.m-1,p.d).getDay()+6)%7};
const mondayOf=iso=>addDays(iso,-dow(iso));
const daysUntil=iso=>dayNum(iso)-dayNum(todayISO());
const shiftMonth=(key,n)=>{const p=parts(key+"-01");const d=new Date(p.y,p.m-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const monthName=key=>{const p=parts(key+"-01");return new Date(p.y,p.m-1,1).toLocaleDateString("pt-PT",{month:"long"})};
const monthLabel=key=>monthName(key)+" "+key.slice(0,4);
const fmtDM=iso=>{const p=parts(iso);return pad(p.d)+"/"+pad(p.m)};
const fmtDMY=iso=>{const p=parts(iso);return pad(p.d)+"/"+pad(p.m)+"/"+p.y};
const longDay=iso=>{const p=parts(iso);return new Date(p.y,p.m-1,p.d).toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"short"})};
const dayHeading=iso=>iso===todayISO()?"Hoje":(()=>{const p=parts(iso);return new Date(p.y,p.m-1,p.d).toLocaleDateString("pt-PT",{weekday:"short",day:"numeric",month:"short"})})();
const newId=()=>"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const DEFAULT_CFG={
  sections:[{id:"casa",name:"Casa",color:0},{id:"silvia",name:"Silvia",color:1},{id:"rui",name:"Rui",color:2},{id:"miguel",name:"Miguel",color:3},{id:"matilde",name:"Matilde",color:4},{id:"matias",name:"Matias",color:5}],
  categories:[{id:"agua",name:"Água"},{id:"luz",name:"Luz"},{id:"gas",name:"Gás"},{id:"net",name:"Internet e telemóveis"},{id:"super",name:"Supermercado"},{id:"comer",name:"Restaurantes e cafés"},{id:"comb",name:"Combustível e transportes"},{id:"saude",name:"Saúde"},{id:"escola",name:"Escola e formação"},{id:"roupa",name:"Roupa e calçado"},{id:"lazer",name:"Lazer"},{id:"outros",name:"Outros"}],
  budgets:{}
};
const FREQS=[["monthly","Todos os meses"],["weekly","Todas as semanas"],["daily","Todos os dias"],["yearly","Todos os anos"]];

function parseAmount(s,allowZero){
  s=String(s).replace(/\s/g,"").replace("€","");
  if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");
  if(s==="")return null;
  const v=Number(s);
  if(!isFinite(v)||v<0||(v===0&&!allowZero)||v>10000000)return null;
  return Math.round(v*100);
}
const parseNum=s=>{s=String(s).replace(/\s/g,"");if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");const v=Number(s);return (s!==""&&isFinite(v)&&v>0)?v:null};

/* despesas fixas: ocorrências num mês */
function occ(r,key){
  if(r.active===false||!r.start)return [];
  const p=parts(key+"-01"),n=dim(p.y,p.m),s=parts(r.start),out=[];
  for(let d=1;d<=n;d++){
    const iso=key+"-"+pad(d);
    if(iso<r.start)continue;
    if(r.end&&iso>r.end)continue;
    let ok=false;
    if(r.freq==="daily")ok=true;
    else if(r.freq==="weekly")ok=(dayNum(iso)-dayNum(r.start))%7===0;
    else if(r.freq==="yearly")ok=(p.m===s.m&&d===Math.min(s.d,n));
    else ok=(d===Math.min(s.d,n));
    if(ok)out.push(iso);
  }
  return out;
}
function monthItems(key){
  const items=[];
  D("expenses").forEach(e=>{if(e.date&&e.date.slice(0,7)===key)items.push({kind:"e",id:e.id,date:e.date,desc:e.desc,cents:e.cents||0,section:e.section,category:e.category,notes:e.notes,pending:e.pending})});
  D("recurring").forEach(r=>{occ(r,key).forEach(dt=>items.push({kind:"r",id:r.id,date:dt,desc:r.desc,cents:r.cents||0,section:r.section,category:r.category,notes:r.notes}))});
  items.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  return items;
}
const counted=(items,key)=>{const t=todayISO();return key>t.slice(0,7)?items:items.filter(i=>i.date<=t)};
const sum=items=>items.reduce((a,i)=>a+i.cents,0);
const monthlyEquiv=r=>{const c=r.cents||0;return r.freq==="daily"?c*365/12:r.freq==="weekly"?c*52/12:r.freq==="yearly"?c/12:c};
function freqLabel(r){
  const s=r.start?parts(r.start):null;if(!s)return "";
  if(r.freq==="daily")return "Todos os dias";
  if(r.freq==="weekly")return "Todas as semanas ("+new Date(s.y,s.m-1,s.d).toLocaleDateString("pt-PT",{weekday:"long"})+")";
  if(r.freq==="yearly")return "Todos os anos, "+s.d+" de "+new Date(s.y,s.m-1,1).toLocaleDateString("pt-PT",{month:"long"});
  return "Todos os meses, dia "+s.d;
}

/* agenda: ocorrências de um evento num dia */
function evOccurs(ev,iso){
  if(!ev.date||iso<ev.date)return false;
  if(ev.until&&iso>ev.until)return false;
  if((ev.skips||[]).indexOf(iso)>=0)return false;
  const s=parts(ev.date),p=parts(iso);
  switch(ev.repeat){
    case "daily":return true;
    case "weekdays":return dow(iso)<5;
    case "weekly":return (dayNum(iso)-dayNum(ev.date))%7===0;
    case "monthly":return p.d===Math.min(s.d,dim(p.y,p.m));
    case "yearly":return p.m===s.m&&p.d===Math.min(s.d,dim(p.y,p.m));
    default:return iso===ev.date;
  }
}
const dayEvents=(iso,who)=>D("events").filter(ev=>evOccurs(ev,iso)&&(!who||who==="all"||ev.person===who||ev.person==="todos")).sort((a,b)=>(a.time||"")<(b.time||"")?-1:(a.time||"")>(b.time||"")?1:0);

/* carros */
const unitOf=car=>car&&car.fuel==="Elétrico"?"kWh":"L";
function carCons(car){
  const fills=D("carlog").filter(l=>l.car===car.id&&l.type==="fuel"&&l.km>0&&l.liters>0).sort((a,b)=>a.km-b.km||(a.date<b.date?-1:1));
  const by={};let lastFull=null,acc=0,sumL=0,sumK=0,last=null;
  fills.forEach(f=>{
    if(lastFull===null){if(f.full)lastFull=f.km;return}
    acc+=f.liters;
    if(f.full){const dk=f.km-lastFull;if(dk>0){const c=acc/dk*100;by[f.id]=c;last=c;sumL+=acc;sumK+=dk}lastFull=f.km;acc=0}
  });
  return {by,last,avg:sumK?sumL/sumK*100:null};
}

function exportCsv(){
  const cur=todayISO().slice(0,7);let min=cur;
  D("expenses").forEach(e=>{if(e.date&&e.date.slice(0,7)<min)min=e.date.slice(0,7)});
  D("recurring").forEach(r=>{if(r.start&&r.start.slice(0,7)<min)min=r.start.slice(0,7)});
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[["Data","Tipo","Descrição","Valor (€)","Secção","Categoria","Notas"]];
  for(let k=min;k<=cur;k=shiftMonth(k,1))counted(monthItems(k),k).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(i=>rows.push([fmtDMY(i.date),i.kind==="r"?"Fixa":"Única",i.desc,(i.cents/100).toFixed(2).replace(".",","),secName(i.section),catName(i.category),i.notes||""]));
  const blob=new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="para-onde-vai-"+todayISO()+".csv";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Ficheiro exportado");
}

/* ---------- folha de formulário genérica ---------- */
function closeForm(){$("#back").hidden=true;$("#sheet").innerHTML=""}
const formErr=m=>{const e=$("#f-err");if(e)e.textContent=m};
function fieldHtml(f){
  const id="f-"+f.k,v=f.v==null?"":f.v;
  if(f.t==="check")return '<label class="check"><input type="checkbox" id="'+id+'"'+(f.v?" checked":"")+'>'+esc(f.l)+'</label>';
  let c='<label for="'+id+'">'+esc(f.l)+'</label>';
  if(f.t==="select")c+='<select id="'+id+'">'+f.o.map(x=>'<option value="'+esc(x[0])+'"'+(String(x[0])===String(f.v)?" selected":"")+'>'+esc(x[1])+'</option>').join("")+'</select>';
  else if(f.t==="area")c+='<textarea id="'+id+'" rows="2" maxlength="300" placeholder="'+esc(f.p||"")+'">'+esc(v)+'</textarea>';
  else{
    const typ=f.t==="date"?"date":f.t==="time"?"time":"text",im=(f.t==="money"||f.t==="dec")?' inputmode="decimal"':f.t==="int"?' inputmode="numeric"':"";
    c+='<input type="'+typ+'" id="'+id+'"'+im+' maxlength="80" autocomplete="off" placeholder="'+esc(f.p||"")+'" value="'+esc(v)+'"'+(f.list?' list="'+id+'-l"':"")+'>'+(f.list?'<datalist id="'+id+'-l">'+f.list.map(x=>'<option value="'+esc(x)+'">').join("")+'</datalist>':"");
  }
  return c;
}
function showSheet(o){
  let h='<h3 id="sheet-title">'+esc(o.title)+'</h3>'+(o.intro?'<p class="hint">'+o.intro+'</p>':"")+'<form id="form" novalidate>';
  const keys=[];
  o.fields.forEach(f=>{
    if(Array.isArray(f)){h+='<div class="row2">'+f.map(x=>{keys.push(x);return '<div>'+fieldHtml(x)+'</div>'}).join("")+'</div>'}
    else{keys.push(f);h+=fieldHtml(f)}
  });
  h+='<p class="err" id="f-err" role="alert"></p><div class="actions">'+(o.onDelete?'<button type="button" class="btn danger" id="f-del">'+esc(o.deleteLabel||"Apagar")+'</button>':"")+'<span class="grow"></span><button type="button" class="btn" id="f-cancel">Cancelar</button><button type="submit" class="btn pri" id="f-save">Guardar</button></div></form>';
  $("#sheet").innerHTML=h;$("#back").hidden=false;

    if(!d.dataset.armed){d.dataset.armed="1";d.textContent="Confirmar: apagar";setTimeout(()=>{if(d.isConnected){delete d.dataset.armed;d.textContent=o.deleteLabel||"Apagar"}},4000);return}

  if(item&&secIndex(item.section)<0)secs.push({id:item.section||"",name:"Sem secção"});
  if(item&&!c.categories.some(x=>x.id===item.category))cats.push({id:item.category||"",name:"Sem categoria"});

  if(!editing)h+='<div class="seg" role="radiogroup" aria-label="Tipo"><input type="radio" name="f-kind" id="k-e" value="e"'+(isRec?"":" checked")+'><label for="k-e">Única</label><input type="radio" name="f-kind" id="k-r" value="r"'+(isRec?" checked":"")+'><label for="k-r">Fixa (repete)</label></div>';

    '<div class="row2"><div><label for="f-section">Secção</label><select id="f-section">'+opts(secs,secSel)+'</select></div><div><label for="f-category">Categoria</label><select id="f-category">'+opts(cats,catSel)+'</select></div></div>'+
    '<label for="f-notes">Notas (opcional)</label><textarea id="f-notes" maxlength="300" rows="2" placeholder="ex.: prenda de anos">'+esc(item&&item.notes?item.notes:"")+'</textarea>'+
    '<div id="g-once"><label for="f-date">Data</label><input type="date" id="f-date" value="'+esc(item&&!isRec?item.date:todayISO())+'"></div>'+
    '<div id="g-rec"><label for="f-freq">Repete</label><select id="f-freq">'+FREQS.map(f=>'<option value="'+f[0]+'"'+(item&&item.freq===f[0]?" selected":"")+'>'+f[1]+'</option>').join("")+'</select><div class="row2"><div><label for="f-start">Começa em</label><input type="date" id="f-start" value="'+esc(item&&isRec?item.start:todayISO())+'"></div><div><label for="f-end">Termina em (opcional)</label><input type="date" id="f-end" value="'+esc(item&&isRec?(item.end||""):"")+'"></div></div>'+

    '<p class="err" id="f-err" role="alert"></p><div class="actions">'+(editing?'<button type="button" class="btn danger" id="f-del">Apagar</button>':"")+'<span class="grow"></span><button type="button" class="btn" id="f-cancel">Cancelar</button><button type="submit" class="btn pri" id="f-save">Guardar</button></div></form>';

  const del=$("#f-del");
  if(del)del.addEventListener("click",()=>{
    if(!del.dataset.armed){del.dataset.armed="1";del.textContent="Confirmar: apagar";setTimeout(()=>{if(del.isConnected){delete del.dataset.armed;del.textContent="Apagar"}},4000);return}
    st.db.collection(kind==="r"?"recurring":"expenses").doc(item.id).delete().catch(wfail);closeForm();toast("Apagado");
  });
  $("#form").addEventListener("submit",e=>{e.preventDefault();saveExpense(kindNow,item)});
  setTimeout(()=>{const f=$("#f-desc");if(f&&!editing)f.focus()},50);
}
function saveExpense(kind,item){
  const desc=$("#f-desc").value.trim(),cents=parseAmount($("#f-amount").value);
  const section=$("#f-section").value,category=$("#f-category").value;
  if(!desc){formErr("Escreva o que foi.");return}
  if(cents==null){formErr("O valor tem de ser um número maior que zero, por exemplo 12,50.");return}
  let coll,data;
  if(kind==="r"){
    const start=$("#f-start").value,end=$("#f-end").value;
    if(!start){formErr("Indique quando começa.");return}
    if(end&&end<start){formErr("A data de fim é anterior ao início.");return}
    const act=$("#f-active");
    data={desc,cents,section,category,freq:$("#f-freq").value,start,end:end||"",active:act?act.checked:true};coll="recurring";
  }else{
    const date=$("#f-date").value;
    if(!date){formErr("Indique a data.");return}
    data={desc,cents,section,category,date};coll="expenses";
  }
  data.notes=$("#f-notes").value.trim();
  const old=item?D(coll).find(x=>x.id===item.id):null;
  data.createdAt=old&&old.createdAt?old.createdAt:Date.now();
  if(old&&old.link)data.link=old.link;
  const ref=item?st.db.collection(coll).doc(item.id):st.db.collection(coll).doc();
  ref.set(data).catch(wfail);
  setLast({section,category});
  if(coll==="expenses"&&!item&&data.date.slice(0,7)!==st.month)st.month=data.date.slice(0,7);
  closeForm();toast("Guardado");render();
}

/* ---------- definições: gravar ---------- */
function cloneCfg(){const c=cfg();return {sections:c.sections.map((x,i)=>({id:x.id,name:x.name,color:(typeof x.color==="number"?x.color:i%8)})),categories:c.categories.map(x=>({id:x.id,name:x.name})),budgets:Object.assign({},c.budgets||{})}}
function saveCfg(n){
  if(!st.db){toast("Sem ligação");return}
  st.db.doc("config/main").set({sections:n.sections,categories:n.categories,budgets:n.budgets||{},updatedAt:Date.now()}).catch(wfail);
}

/* ---------- agenda: formulários ---------- */
function openEvent(ev,opt){
  opt=opt||{};
  const single=opt.single;
  const base=ev?Object.assign({},ev):{};
  if(single){base.date=single;base.repeat="none";base.until=""}
  const persons=[["todos","Todos"]].concat(cfg().sections.map(s=>[s.id,s.name]));
  const defDate=(st.weekStart<=todayISO()&&todayISO()<=addDays(st.weekStart,6))?todayISO():st.weekStart;
  showSheet({
    title:single?"Só neste dia ("+fmtDM(single)+")":ev?"Editar evento":"Novo evento",
    fields:[{k:"title",l:"O que é",t:"text",v:base.title||"",p:"ex.: Sai da escola, Treino, Consulta"},
      {k:"person",l:"De quem",t:"select",o:persons,v:base.person||lastUsed().evp||"todos"},
      {k:"date",l:"Data",t:"date",v:base.date||defDate},
      [{k:"time",l:"Hora",t:"time",v:base.time||""},{k:"end",l:"Até às (opcional)",t:"time",v:base.end||""}],
      {k:"repeat",l:"Repete",t:"select",o:EREPEAT,v:base.repeat||"none"},
      {k:"until",l:"Repete até (opcional)",t:"date",v:base.until||""},
      {k:"notes",l:"Notas (opcional)",t:"area",v:base.notes||"",p:"ex.: levar a mochila do ginásio"}],
    onDelete:(ev&&!single)?()=>{st.db.collection("events").doc(ev.id).delete().catch(wfail);toast("Apagado")}:null,
    onSave:v=>{
      if(!v.title)return "Escreva o que é.";
      if(!v.date)return "Indique a data.";
      if(v.end&&v.time&&v.end<v.time)return "A hora de fim é antes da hora de início.";
      if(v.until&&v.until<v.date)return "A data final é anterior ao início.";
      const data={title:v.title,person:v.person,date:v.date,time:v.time,end:v.end,repeat:v.repeat,until:v.until,notes:v.notes,skips:(ev&&!single&&ev.skips)||[],createdAt:(ev&&!single&&ev.createdAt)||Date.now()};
      const ref=(ev&&!single)?st.db.collection("events").doc(ev.id):st.db.collection("events").doc();
      ref.set(data).catch(wfail);
      if(single&&ev)st.db.collection("events").doc(ev.id).update({skips:(ev.skips||[]).concat([single])}).catch(wfail);
      setLast({evp:v.person});toast("Guardado");
      return null;
    }
  });
}
function onEv(id,iso){
  const ev=D("events").find(e=>e.id===id);if(!ev)return;
  if(ev.repeat&&ev.repeat!=="none")showChoice(ev.title+" · "+longDay(iso),[
    {label:"Mudar só neste dia",fn:()=>openEvent(ev,{single:iso})},
    {label:"Cancelar só neste dia",fn:()=>{st.db.collection("events").doc(ev.id).update({skips:(ev.skips||[]).concat([iso])}).catch(wfail);toast("Dia cancelado")}},
    {label:"Editar todos (ou apagar)",fn:()=>openEvent(ev)}]);
  else openEvent(ev);
}

/* ---------- carros: formulários ---------- */
const FUELS=["Gasóleo","Gasolina","Elétrico","Híbrido","GPL"];
function openCar(car){
  showSheet({title:car?"Editar carro":"Novo carro",
    fields:[{k:"name",l:"Nome do carro",t:"text",v:car?car.name:"",p:"ex.: Mercedes A180"},
      [{k:"plate",l:"Matrícula (opcional)",t:"text",v:car?car.plate||"":""},{k:"fuel",l:"Combustível",t:"select",o:FUELS.map(f=>[f,f]),v:car?car.fuel:"Gasóleo"}],
      {k:"section",l:"De quem é",t:"select",o:cfg().sections.map(s=>[s.id,s.name]),v:car?car.section:(lastUsed().section||cfg().sections[0].id)}],
    intro:car?"Apagar o carro apaga o histórico de abastecimentos. As despesas já registadas mantêm-se.":null,
    onDelete:car?()=>{const b=st.fs.batch();b.delete(st.db.collection("cars").doc(car.id));D("carlog").filter(l=>l.car===car.id).forEach(l=>b.delete(st.db.collection("carlog").doc(l.id)));b.commit().catch(wfail);st.carSel=null;toast("Carro apagado")}:null,
    onSave:v=>{
      if(!v.name)return "Escreva o nome do carro.";
      const ref=car?st.db.collection("cars").doc(car.id):st.db.collection("cars").doc();
      ref.set({name:v.name,plate:v.plate,fuel:v.fuel,section:v.section,reminders:car?car.reminders||[]:[],createdAt:car&&car.createdAt||Date.now()}).catch(wfail);
      st.carSel=ref.id;toast("Guardado");return null;
    }});
}
function combCat(){const c=cfg().categories.find(x=>x.id==="comb")||cfg().categories.find(x=>/combust/i.test(x.name))||cfg().categories[0];return c.id}
function logSave(car,type,item,v){
  const col=st.db.collection("carlog"),ref=item?col.doc(item.id):col.doc();
  const cents=parseAmount(v.cents);if(cents==null)return "Indique o valor total pago, por exemplo 52,30.";
  if(!v.date)return "Indique a data.";
  const km=v.km?Number(String(v.km).replace(/\D/g,"")):0;
  const data={car:car.id,type,date:v.date,km,cents,notes:v.notes||"",createdAt:item&&item.createdAt||Date.now()};
  if(type==="fuel"){
    const l=parseNum(v.liters);if(!l)return "Indique os "+(unitOf(car)==="kWh"?"kWh":"litros")+", por exemplo 42,5.";
    if(!km)return "Indique os quilómetros do conta-quilómetros.";
    data.liters=l;data.full=!!v.full;
  }else{if(!v.desc)return "Escreva o que foi feito.";data.desc=v.desc}
  const expRef=st.db.collection("expenses").doc((type==="fuel"?"fuel-":"svc-")+ref.id);
  const exp={desc:type==="fuel"?(unitOf(car)==="kWh"?"Carregamento":"Abastecimento")+" · "+car.name:v.desc+" · "+car.name,cents,section:car.section||cfg().sections[0].id,category:combCat(),date:v.date,notes:type==="fuel"?nf(data.liters,2)+" "+unitOf(car):"",createdAt:data.createdAt,link:"carlog"};
  const b=st.fs.batch();b.set(ref,data);b.set(expRef,exp);b.commit().catch(wfail);
  toast("Guardado e somado às despesas");return null;
}
function logDelete(car,type,item){
  const b=st.fs.batch();b.delete(st.db.collection("carlog").doc(item.id));b.delete(st.db.collection("expenses").doc((type==="fuel"?"fuel-":"svc-")+item.id));b.commit().catch(wfail);toast("Apagado");
}
function openFuel(car,item){
  if(!car){openCar(null);return}
  const u=unitOf(car),what=u==="kWh"?"Carregamento":"Abastecimento";
  showSheet({title:item?"Editar "+what.toLowerCase():"Novo "+what.toLowerCase(),
    fields:[[{k:"date",l:"Data",t:"date",v:item?item.date:todayISO()},{k:"km",l:"Quilómetros (do painel)",t:"int",v:item&&item.km?item.km:"",p:"ex.: 123456"}],
      [{k:"liters",l:u==="kWh"?"kWh":"Litros",t:"dec",v:item?String(item.liters).replace(".",","):"",p:"0,0"},{k:"cents",l:"Total pago (€)",t:"money",v:item?toInput(item.cents):"",p:"0,00"}],
      {k:"full",l:"Encheu o depósito (ou carga completa)",t:"check",v:item?item.full:true},
      {k:"notes",l:"Notas (opcional)",t:"area",v:item?item.notes||"":""}],
    intro:"O valor é somado às Despesas, na categoria de combustível.",
    onDelete:item?()=>logDelete(car,"fuel",item):null,
    onSave:v=>logSave(car,"fuel",item,v)});
}
function openService(car,item){
  if(!car){openCar(null);return}
  showSheet({title:item?"Editar manutenção":"Nova manutenção",
    fields:[{k:"desc",l:"O que foi feito",t:"text",v:item?item.desc:"",p:"ex.: Revisão, pneus, óleo"},
      [{k:"date",l:"Data",t:"date",v:item?item.date:todayISO()},{k:"km",l:"Quilómetros (opcional)",t:"int",v:item&&item.km?item.km:""}],
      {k:"cents",l:"Total pago (€)",t:"money",v:item?toInput(item.cents):"",p:"0,00"},
      {k:"notes",l:"Notas (opcional)",t:"area",v:item?item.notes||"":""}],
    intro:"O valor é somado às Despesas.",
    onDelete:item?()=>logDelete(car,"service",item):null,
    onSave:v=>logSave(car,"service",item,v)});
}
function openReminder(car,rem){
  if(!car)return;
  showSheet({title:rem?"Editar lembrete":"Novo lembrete",
    fields:[{k:"label",l:"O que não esquecer",t:"text",v:rem?rem.label:"",p:"ex.: Seguro, IPO, IUC, Revisão",list:["Seguro","IPO","IUC","Revisão","Pneus","Cartão verde"]},{k:"date",l:"Data limite",t:"date",v:rem?rem.date:""}],
    intro:"Aparece no Resumo 30 dias antes do prazo.",
    onDelete:rem?()=>{st.db.collection("cars").doc(car.id).update({reminders:(car.reminders||[]).filter(r=>r.id!==rem.id)}).catch(wfail);toast("Apagado")}:null,
    onSave:v=>{
      if(!v.label)return "Escreva o que não esquecer.";
      if(!v.date)return "Indique a data limite.";
      const list=(car.reminders||[]).filter(r=>!rem||r.id!==rem.id).concat([{id:rem?rem.id:newId(),label:v.label,date:v.date}]);
      st.db.collection("cars").doc(car.id).update({reminders:list}).catch(wfail);toast("Guardado");return null;
    }});
}

/* ---------- metas ---------- */
function openGoal(g){
  showSheet({title:g?"Editar meta":"Nova meta",
    fields:[{k:"name",l:"Nome da meta",t:"text",v:g?g.name:"",p:"ex.: Férias de verão"},
      [{k:"target",l:"Objetivo (€)",t:"money",v:g?toInput(g.targetCents):"",p:"0,00"},{k:"saved",l:"Já poupado (€)",t:"money",v:g?toInput(g.savedCents||0):"",p:"0,00"}],
      {k:"section",l:"De quem é",t:"select",o:[["","Toda a família"]].concat(cfg().sections.map(s=>[s.id,s.name])),v:g?g.section||"":""},
      {k:"deadline",l:"Até quando (opcional)",t:"date",v:g?g.deadline||"":""}],
    onDelete:g?()=>{st.db.collection("goals").doc(g.id).delete().catch(wfail);toast("Apagada")}:null,
    onSave:v=>{
      if(!v.name)return "Escreva o nome da meta.";
      const t=parseAmount(v.target);if(t==null)return "Indique o objetivo, por exemplo 1500.";
      const s=v.saved?parseAmount(v.saved,true):0;if(s==null)return "O valor já poupado não é válido.";
      const ref=g?st.db.collection("goals").doc(g.id):st.db.collection("goals").doc();
      ref.set({name:v.name,targetCents:t,savedCents:s,section:v.section,deadline:v.deadline,createdAt:g&&g.createdAt||Date.now()}).catch(wfail);toast("Guardado");return null;
    }});
}
function openMove(g,sign){
  showSheet({title:(sign>0?"Depositar em ":"Retirar de ")+g.name,fields:[{k:"amt",l:"Valor (€)",t:"money",v:"",p:"0,00"}],
    onSave:v=>{
      const a=parseAmount(v.amt);if(a==null)return "Indique um valor maior que zero.";
      const n=Math.max(0,(g.savedCents||0)+sign*a);
      st.db.collection("goals").doc(g.id).update({savedCents:n}).catch(wfail);toast(sign>0?"Depositado":"Retirado");return null;
    }});
}

/* ---------- eventos de clique ---------- */
const fabAction=()=>{
  switch(st.tab){
    case "agenda":openEvent(null);break;
    case "carros":openFuel(selCar());break;
    case "compras":{const i=$("#sh-in");if(i)i.focus();break}
    case "metas":openGoal(null);break;
    case "fixas":openForm("r",null);break;
    default:openForm("e",null);
  }
};
const randCode=()=>{const a="abcdefghjkmnpqrstuvwxyz23456789",r=new Uint32Array(16);crypto.getRandomValues(r);return Array.from(r,x=>a[x%a.length]).join("")};
function addShopping(){
  const i=$("#sh-in");if(!i)return;const t=i.value.trim();if(!t)return;
  st.db.collection("shopping").doc().set({text:t,done:false,createdAt:Date.now()}).catch(wfail);i.value="";
}
document.addEventListener("click",e=>{
  const mm=e.target.closest&&e.target.closest("[data-m]");
  if(mm){st.month=mm.getAttribute("data-m");render();return}
  const t=e.target.closest("button");if(!t)return;
  const ds=t.dataset;
  if(ds.ch!=null){const b=st.choice[+ds.ch];closeForm();if(b)b.fn();return}
  if(t.id==="f-cancel"){closeForm();return}
  if(t.id==="fab"){fabAction();return}
  if(t.id==="code-new"){$("#code-in").value=randCode();return}
  if(t.id==="code-go"){const cc=$("#code-in").value.trim();if(!/^[A-Za-z0-9_-]{8,64}$/.test(cc)){toast("O código tem de ter 8 a 64 letras ou números");return}try{localStorage.setItem("pov-code",cc)}catch(x){}location.hash="c="+cc;location.reload();return}
  if(t.id==="copylink"){const inp=$("#sharelink");inp.select();try{navigator.clipboard.writeText(inp.value).then(()=>toast("Link copiado"),()=>toast("Selecione e copie o link"))}catch(x){toast("Selecione e copie o link")}return}
  if(ds.tab){st.tab=ds.tab;render();window.scrollTo(0,0);return}
  if(ds.go){st.tab=ds.go;if(ds.car)st.carSel=ds.car;render();window.scrollTo(0,0);return}
  if(t.id==="prev"){st.month=shiftMonth(st.month,-1);render();return}
  if(t.id==="next"){st.month=shiftMonth(st.month,1);render();return}
  if(ds.filter){st.filter=ds.filter;render();return}
  if(ds.cwho){st.chartWho=ds.cwho;render();return}
  if(ds.cmode){st.chartMode=ds.cmode;render();return}
  if(ds.wk!=null){const n=+ds.wk;st.weekStart=n===0?mondayOf(todayISO()):addDays(st.weekStart,7*n);render();return}
  if(ds.agwho){st.agWho=ds.agwho;render();return}
  if(ds.agpay){st.agPay=!st.agPay;render();return}
  if(ds.ev){onEv(ds.ev,ds.d);return}
  if(ds.kind&&ds.id){const it=(ds.kind==="r"?D("recurring"):D("expenses")).find(x=>x.id===ds.id);if(it)openForm(ds.kind,it);return}
  if(ds.car){st.carSel=ds.car;render();return}
  if(ds.newcar){openCar(null);return}
  if(ds.editcar){openCar(selCar());return}
  if(ds.addfuel){openFuel(selCar());return}
  if(ds.addsvc){openService(selCar());return}
  if(ds.addrem){openReminder(selCar(),null);return}
  if(ds.rem){const c=selCar();openReminder(c,(c.reminders||[]).find(r=>r.id===ds.rem));return}
  if(ds.log){const c=selCar(),l=D("carlog").find(x=>x.id===ds.log);if(l)(l.type==="fuel"?openFuel:openService)(c,l);return}
  if(ds.shadd){addShopping();return}
  if(ds.sh){const i=D("shopping").find(x=>x.id===ds.sh);if(i)st.db.collection("shopping").doc(i.id).update({done:!i.done}).catch(wfail);return}
  if(ds.shclear){const b=st.fs.batch();D("shopping").filter(i=>i.done).forEach(i=>b.delete(st.db.collection("shopping").doc(i.id)));b.commit().catch(wfail);return}
  if(ds.shexp){openForm("e",null,{desc:"Compras",category:"super"});return}
  if(ds.gdep||ds.gwd||ds.gedit){const g=D("goals").find(x=>x.id===(ds.gdep||ds.gwd||ds.gedit));if(g){if(ds.gedit)openGoal(g);else openMove(g,ds.gdep?1:-1)}return}
  if(ds.export){exportCsv();return}
  if(ds.install&&st.installEv){st.installEv.prompt();st.installEv=null;render();return}
  if(ds.color){const n=cloneCfg();n.sections.forEach(x=>{if(x.id===ds.color)x.color=(x.color+1)%8});saveCfg(n);return}
  if(ds.add){const k=ds.add,inp=$("#new-"+k),name=inp.value.trim();if(!name)return;const n=cloneCfg();n[k].push(k==="sections"?{id:newId(),name,color:n[k].length%8}:{id:newId(),name});inp.value="";saveCfg(n);return}
  if(ds.remove){
    const k=ds.remove,n=cloneCfg();
    if(n[k].length<=1){toast("Tem de ficar pelo menos uma");return}
    if(!t.dataset.armed){t.dataset.armed="1";t.textContent="?";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="×"}},3000);toast("Toque outra vez para remover");return}
    n[k]=n[k].filter(x=>x.id!==ds.id);delete n.budgets[(k==="sections"?"s:":"c:")+ds.id];saveCfg(n);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.rename){const name=t.value.trim(),n=cloneCfg();if(!name){render();return}n[t.dataset.rename].forEach(x=>{if(x.id===t.dataset.id)x.name=name});saveCfg(n)}
  if(t.dataset&&t.dataset.bud){const n=cloneCfg(),c=t.value.trim()?parseAmount(t.value):null;if(t.value.trim()&&c==null){toast("Valor inválido");render();return}if(c)n.budgets[t.dataset.bud]=c;else delete n.budgets[t.dataset.bud];saveCfg(n)}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;const l=$("#list");if(l)l.innerHTML=despesasList()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#back").hidden)closeForm();
  if(e.key==="Enter"&&e.target.id){
    if(e.target.id.indexOf("new-")===0){const b=document.querySelector('[data-add="'+e.target.id.slice(4)+'"]');if(b)b.click()}
    if(e.target.id==="sh-in"){e.preventDefault();addShopping()}
  }
});
$("#back").addEventListener("click",e=>{if(e.target.id==="back")closeForm()});
window.addEventListener("online",render);window.addEventListener("offline",render);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();st.installEv=e;renderSoft()});

/* ---------- ligação aos dados ---------- */
const snapErr=()=>{st.timedOut=true;render()};
async function start(){
  render();
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
  const fbc=window.FIREBASE_CONFIG;
  if(!fbc||!fbc.projectId||/COLE/i.test(fbc.apiKey||"")||/COLE/i.test(fbc.projectId||"")){st.setup="config";render();return}
  if(typeof firebase==="undefined"){st.db=null;render();return}
  const m=location.hash.match(/c=([A-Za-z0-9_-]{8,64})/);
  let code=m?m[1]:null;
  if(code){try{localStorage.setItem("pov-code",code)}catch(e){}}
  else{try{code=localStorage.getItem("pov-code")}catch(e){}}
  if(!code){st.setup="code";render();return}
  st.code=code;
  firebase.initializeApp(fbc);
  const fs=firebase.firestore();st.fs=fs;
  try{await Promise.race([fs.enablePersistence({synchronizeTabs:true}),new Promise(r=>setTimeout(r,3000))])}catch(e){}
  const base="families/"+code;
  st.db={
    collection:n=>{const c=fs.collection(base+"/"+n);return {doc:id=>id?c.doc(id):c.doc(),onSnapshot:(cb,er)=>c.onSnapshot({includeMetadataChanges:true},cb,er)}},
    doc:p=>{const d=fs.doc(base+"/"+p);return {set:x=>d.set(x),update:x=>d.update(x),delete:()=>d.delete(),onSnapshot:(cb,er)=>d.onSnapshot({includeMetadataChanges:true},cb,er)}}
  };
  const timer=setTimeout(()=>{if(!coreLoaded())snapErr()},10000);
  const done=()=>{if(coreLoaded()){clearTimeout(timer);st.timedOut=false}};
  COLS.forEach(n=>st.db.collection(n).onSnapshot(s=>{st.d[n]=s.docs.map(d=>Object.assign({id:d.id,pending:d.metadata.hasPendingWrites},d.data()));st.loaded[n]=true;done();renderSoft()},snapErr));
  st.db.doc("config/main").onSnapshot(s=>{st.config=s.exists?s.data():null;st.loaded.config=true;done();renderSoft()},snapErr);
  render();
}
start();
})();
